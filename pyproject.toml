[project]
name = "stt-mlx"
version = "0.1.0"
description = "MLX-accelerated speech-to-text with speaker diarization (mlx_whisper + senko)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "librosa>=1.0.0",
    "mlx-whisper>=0.4",
    "numpy>=2.4.6",
    "senko",
    "soundfile>=0.14.0",
    "torch>=2.8.0",
    "transformers>=5.18",
]

[project.scripts]
stt = "stt_mlx.cli:main"

[tool.uv.sources]
senko = { git = "https://github.com/narcotic-sh/senko.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stt_mlx"]
